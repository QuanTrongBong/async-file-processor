version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: async_rabbitmq
    ports:
      - "5672:5672"   # Cổng giao tiếp cho API và Worker
      - "15672:15672" # Cổng giao diện Web quản lý (user/pass mặc định: guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  postgres:
    image: postgres:15-alpine
    container_name: async_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: file_processor_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: